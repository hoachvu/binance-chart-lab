name: Deploy Apartment Price Lab to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - "apartment-lab/**"
      - ".github/workflows/apartment-pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "apartment-pages"
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Vendor Lightweight Charts
        run: |
          mkdir -p apartment-lab/vendor
          curl -fL --retry 3 --retry-delay 2             https://unpkg.com/lightweight-charts@5.2.1/dist/lightweight-charts.standalone.production.js             -o apartment-lab/vendor/lightweight-charts.standalone.production.js
          test -s apartment-lab/vendor/lightweight-charts.standalone.production.js

      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload Apartment Lab
        uses: actions/upload-pages-artifact@v3
        with:
          path: apartment-lab

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
