name: Deploy Apartment Price Lab to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - "apartment-lab/**"
      - ".github/workflows/apartment-pages.yml"
      - "scripts/validate_apartment_data.py"
      - "tests/test_live_market.py"
      - "tests/market-core.test.cjs"
  workflow_dispatch:
  # GITHUB_TOKEN data commits do not trigger another push workflow.
  workflow_run:
    workflows: ["Update Live Apartment Market"]
    types: [completed]
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "apartment-pages"
  cancel-in-progress: true

jobs:
  deploy:
    if: >-
      github.event_name != 'workflow_run' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.head_branch == 'main' &&
       github.event.workflow_run.head_repository.full_name == github.repository)
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-node@v4
        with:
          node-version: "24"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate price data and chart calculations
        run: |
          python3 -m unittest discover -s tests -p 'test_*.py'
          node --test tests/market-core.test.cjs
          node --check apartment-lab/app.js
          python3 scripts/validate_apartment_data.py

      - name: Vendor Lightweight Charts
        run: |
          mkdir -p apartment-lab/vendor
          curl -fL --retry 3 --retry-delay 2 \
            https://unpkg.com/lightweight-charts@5.2.1/dist/lightweight-charts.standalone.production.js \
            -o apartment-lab/vendor/lightweight-charts.standalone.production.js
          test -s apartment-lab/vendor/lightweight-charts.standalone.production.js

      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload Apartment Lab
        uses: actions/upload-pages-artifact@v3
        with:
          path: apartment-lab

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
